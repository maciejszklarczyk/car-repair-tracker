name: AI Code Reviewer
description: Reviews PR diff using Gemini AI via Vercel AI SDK

inputs:
  api-key:
    description: OpenRouter API key
    required: true
  diff-file:
    description: Path to file containing the git diff
    required: true

outputs:
  verdict:
    description: "pass or fail"
    value: ${{ steps.parse.outputs.verdict }}
  result:
    description: "Full JSON review result"
    value: ${{ steps.agent.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run review agent
      id: agent
      shell: bash
      run: |
        set +e
        RESULT=$(npx tsx ${{ github.action_path }}/../../../packages/code-reviewer/review.ts < "$DIFF_FILE" 2>&1)
        EXIT_CODE=$?
        set -e
        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "$RESULT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::warning::Agent exited with code $EXIT_CODE"
          echo "$RESULT"
        fi
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        DIFF_FILE: ${{ inputs.diff-file }}

    - name: Parse verdict
      id: parse
      shell: bash
      run: |
        VERDICT=$(echo "$AGENT_RESULT" | node -e "
          let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
            try { console.log(JSON.parse(d).verdict); } catch { console.log('error'); }
          });
        ")
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
      env:
        AGENT_RESULT: ${{ steps.agent.outputs.result }}

    - name: Write Job Summary
      shell: bash
      run: |
        echo "## 🤖 AI Code Review" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        echo "$AGENT_RESULT" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
      env:
        AGENT_RESULT: ${{ steps.agent.outputs.result }}
