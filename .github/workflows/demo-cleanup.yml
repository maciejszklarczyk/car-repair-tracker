name: Demo Cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose GoTrue connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "SUPABASE_SERVICE_ROLE_KEY length: ${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "SUPABASE_URL ends with: ...${SUPABASE_URL: -20}"

          echo "--- Health check ---"
          curl -s -w "\nHTTP %{http_code}\n" \
            "${SUPABASE_URL}/auth/v1/health" || echo "FAILED"

          echo "--- Admin listUsers via curl ---"
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/auth/v1/admin/users?page=1&per_page=1" || echo "FAILED"

      - name: Install Supabase client
        run: npm install @supabase/supabase-js@2.105.3
      - name: Delete stale demo accounts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');

          async function main() {
            const client = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
              auth: { autoRefreshToken: false, persistSession: false },
            });

            const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            let deleted = 0;
            let page = 1;
            const perPage = 50;

            while (true) {
              const { data, error } = await client.auth.admin.listUsers({ page, perPage });
              if (error) { console.error('List users error:', error.message); process.exit(1); }
              if (!data.users.length) break;

              for (const user of data.users) {
                if (user.email?.endsWith('@demo.cartracker.local') && user.created_at < cutoff) {
                  const { error: delErr } = await client.auth.admin.deleteUser(user.id);
                  if (delErr) { console.error('Delete error for', user.id, delErr.message); }
                  else { deleted++; }
                }
              }

              if (data.users.length < perPage) break;
              page++;
            }

            console.log('Deleted', deleted, 'stale demo account(s)');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          "
