services:
  app:
    image: ghcr.io/maciejszklarczyk/car-repair-tracker:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4321"
      HOST: "0.0.0.0"
    env_file:
      - .env
    networks:
      - zbyszek-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=zbyszek-network"
      - "traefik.http.routers.car-repair-tracker.rule=Host(`car-repair-tracker.msolve.it`)"
      - "traefik.http.routers.car-repair-tracker.entrypoints=web"
      - "traefik.http.services.car-repair-tracker.loadbalancer.server.port=4321"
      - "traefik.http.routers.car-repair-tracker.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${BASIC_AUTH_USERS}"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  zbyszek-network:
    external: true
