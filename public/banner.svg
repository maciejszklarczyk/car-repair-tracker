<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bfdbfe"/>
      <stop offset="50%" style="stop-color:#d8b4fe"/>
      <stop offset="100%" style="stop-color:#f9a8d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Cosmic orbs -->
  <circle cx="150" cy="80" r="120" fill="#7c3aed" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="220" r="100" fill="#3b82f6" opacity="0.06" filter="url(#glow)"/>
  <circle cx="600" cy="30" r="140" fill="#6366f1" opacity="0.05" filter="url(#glow)"/>

  <!-- Star field dots -->
  <circle cx="80" cy="40" r="1" fill="white" opacity="0.3"/>
  <circle cx="220" cy="180" r="1.2" fill="white" opacity="0.2"/>
  <circle cx="350" cy="60" r="0.8" fill="white" opacity="0.25"/>
  <circle cx="480" cy="250" r="1" fill="white" opacity="0.15"/>
  <circle cx="700" cy="45" r="1.3" fill="white" opacity="0.2"/>
  <circle cx="850" cy="270" r="0.9" fill="white" opacity="0.3"/>
  <circle cx="950" cy="80" r="1.1" fill="white" opacity="0.2"/>
  <circle cx="1100" cy="160" r="1" fill="white" opacity="0.25"/>
  <circle cx="1150" cy="50" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="300" cy="270" r="1.2" fill="white" opacity="0.15"/>
  <circle cx="550" cy="120" r="0.8" fill="white" opacity="0.2"/>
  <circle cx="750" cy="200" r="1" fill="white" opacity="0.18"/>

  <!-- Wrench icon -->
  <g transform="translate(100, 105)" opacity="0.9">
    <path d="M0 55 L20 35 L30 45 L55 20 C60 15 68 15 73 20 L80 27 C85 32 85 40 80 45 L55 70 L65 80 L45 100 Z" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gauge/speedometer icon -->
  <g transform="translate(1020, 100)" opacity="0.9">
    <circle cx="40" cy="40" r="35" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <line x1="40" y1="40" x2="55" y2="20" stroke="#d8b4fe" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="3" fill="#d8b4fe"/>
    <!-- Tick marks -->
    <line x1="40" y1="8" x2="40" y2="14" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="25" x2="19" y2="30" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="25" x2="61" y2="30" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="45" x2="14" y2="43" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="72" y1="45" x2="66" y2="43" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="url(#title)">Car Repair Tracker</text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#93c5fd" opacity="0.7">Track repairs. Know your cost/km. Never miss a service deadline.</text>

  <!-- Tech badges -->
  <g transform="translate(355, 200)">
    <!-- Astro -->
    <rect x="0" y="0" width="70" height="26" rx="6" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <text x="35" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Astro 6</text>

    <!-- React -->
    <rect x="82" y="0" width="76" height="26" rx="6" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <text x="120" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">React 19</text>

    <!-- Supabase -->
    <rect x="170" y="0" width="84" height="26" rx="6" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <text x="212" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Supabase</text>

    <!-- TypeScript -->
    <rect x="266" y="0" width="96" height="26" rx="6" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <text x="314" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">TypeScript</text>

    <!-- Tailwind -->
    <rect x="374" y="0" width="92" height="26" rx="6" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <text x="420" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Tailwind 4</text>
  </g>

  <!-- Subtle bottom line -->
  <rect x="400" y="260" width="400" height="1" rx="0.5" fill="url(#accent)" opacity="0.3"/>
</svg>
